name: DFS Slate Capture

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: "Slate date, YYYY-MM-DD. Defaults to today's America/Chicago date."
        required: false
        type: string

  schedule:
    # 13:37 UTC is intentionally not at the top of the hour.
    # During US daylight time this is 8:37 AM Central.
    - cron: "37 13 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dfs-slate-capture-${{ github.event.inputs.slate_date || github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Replace this block with the repo's normal dependency setup if needed.
      # Keep it minimal if the tracker already vendors/bootstraps its own dependencies.
      - name: Install dependencies
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi
          if [[ -f package.json ]]; then
            npm ci
          fi

      - name: Resolve slate date
        id: date
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          RAW="${{ github.event.inputs.slate_date }}"
          ALLOW_NO_SLATE="0"
          ALLOW_EXISTING_SLATE="0"
          LOOKAHEAD_DAYS="0"

          if [[ "${EVENT_NAME}" == "schedule" || -z "${RAW}" ]]; then
            ALLOW_NO_SLATE="1"
            ALLOW_EXISTING_SLATE="1"
            LOOKAHEAD_DAYS="3"
          fi

          if [[ -n "${RAW}" ]]; then
            SLATE_DATE="${RAW}"
          else
            SLATE_DATE="$(TZ=America/Chicago date +%F)"
          fi

          if [[ ! "${SLATE_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid slate date: ${SLATE_DATE}" >&2
            exit 2
          fi

          echo "slate_date=${SLATE_DATE}" >> "${GITHUB_OUTPUT}"
          echo "allow_no_slate=${ALLOW_NO_SLATE}" >> "${GITHUB_OUTPUT}"
          echo "allow_existing_slate=${ALLOW_EXISTING_SLATE}" >> "${GITHUB_OUTPUT}"
          echo "lookahead_days=${LOOKAHEAD_DAYS}" >> "${GITHUB_OUTPUT}"

      - name: Run DFS slate capture
        id: capture
        env:
          SLATE_DATE: ${{ steps.date.outputs.slate_date }}
          ALLOW_NO_SLATE: ${{ steps.date.outputs.allow_no_slate }}
          ALLOW_EXISTING_SLATE: ${{ steps.date.outputs.allow_existing_slate }}
          LOOKAHEAD_DAYS: ${{ steps.date.outputs.lookahead_days }}

          # The wrapper replaces {date} with the resolved slate date.
          DFS_TRACKER_CMD: "python3 scripts/collect_dk_salaries.py --slate-date {date}"

          MIN_SALARY_ROWS: "50"
          WARN_SALARY_ROWS: "500"
          WARN_REVIEW_ROWS: "500"
          WARN_REVIEW_RATIO: "0.50"
        run: |
          scripts/run-dfs-slate-capture.sh "${SLATE_DATE}"

      - name: Create pull request
        id: create-pr
        if: steps.capture.outputs.capture_status == 'captured'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: dfs-salaries/dk-mlb-${{ steps.capture.outputs.selected_slate_date }}
          delete-branch: true
          add-paths: |
            data/shadow/dfs-salaries/dk-mlb-${{ steps.capture.outputs.selected_slate_date }}.csv
            data/shadow/dfs-salaries/dk-mlb-${{ steps.capture.outputs.selected_slate_date }}-review.csv
          commit-message: Add DraftKings MLB salary slate for ${{ steps.capture.outputs.selected_slate_date }}
          title: Add DraftKings MLB salary slate for ${{ steps.capture.outputs.selected_slate_date }}
          body: |
            Automated DraftKings MLB Classic salary capture.

            Requested slate date: `${{ steps.capture.outputs.requested_slate_date }}`
            Selected slate date: `${{ steps.capture.outputs.selected_slate_date }}`
            Salary rows: `${{ steps.capture.outputs.salary_rows }}`
            Review rows: `${{ steps.capture.outputs.review_rows }}`

            Files:
            - `data/shadow/dfs-salaries/dk-mlb-${{ steps.capture.outputs.selected_slate_date }}.csv`
            - `data/shadow/dfs-salaries/dk-mlb-${{ steps.capture.outputs.selected_slate_date }}-review.csv`

      - name: Validate scheduled DFS auto-merge guard
        id: auto-merge-guard
        if: github.event_name == 'schedule' && steps.capture.outputs.capture_status == 'captured' && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          SELECTED_SLATE_DATE: ${{ steps.capture.outputs.selected_slate_date }}
          EXPECTED_SALARY_ROWS: ${{ steps.capture.outputs.salary_rows }}
          EXPECTED_REVIEW_ROWS: ${{ steps.capture.outputs.review_rows }}
        shell: bash
        run: |
          set -euo pipefail

          salary_csv="data/shadow/dfs-salaries/dk-mlb-${SELECTED_SLATE_DATE}.csv"
          review_csv="data/shadow/dfs-salaries/dk-mlb-${SELECTED_SLATE_DATE}-review.csv"
          expected_files="$(mktemp)"
          actual_files="$(mktemp)"

          printf '%s\n' "${review_csv}" "${salary_csv}" | sort > "${expected_files}"
          gh pr diff "${PR_NUMBER}" --name-only | sort > "${actual_files}"

          echo "::group::DFS auto-merge file scope"
          cat "${actual_files}"
          echo "::endgroup::"

          if ! diff -u "${expected_files}" "${actual_files}"; then
            echo "Refusing to auto-merge DFS PR ${PR_NUMBER}: unexpected file scope." >&2
            exit 20
          fi

          python - "${salary_csv}" "${review_csv}" "${EXPECTED_SALARY_ROWS}" "${EXPECTED_REVIEW_ROWS}" <<'PY'
          import csv
          import sys
          from pathlib import Path

          salary_path = Path(sys.argv[1])
          review_path = Path(sys.argv[2])
          expected_salary_rows = int(sys.argv[3])
          expected_review_rows = int(sys.argv[4])

          def count_rows(path: Path) -> int:
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  return max(0, sum(1 for _ in csv.reader(handle)) - 1)

          salary_rows = count_rows(salary_path)
          review_rows = count_rows(review_path)

          if salary_rows != expected_salary_rows:
              raise SystemExit(
                  f"Salary row count changed before auto-merge: {salary_rows} != {expected_salary_rows}"
              )

          if review_rows != expected_review_rows:
              raise SystemExit(
                  f"Review row count changed before auto-merge: {review_rows} != {expected_review_rows}"
              )

          print(f"DFS auto-merge row counts verified: salary={salary_rows}, review={review_rows}")
          PY

          echo "can_auto_merge=true" >> "${GITHUB_OUTPUT}"

      - name: Auto-merge scheduled DFS salary PR
        if: steps.auto-merge-guard.outputs.can_auto_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            mergeable="$(gh pr view "${PR_NUMBER}" --json mergeable --jq '.mergeable')"
            echo "PR ${PR_NUMBER} mergeable state: ${mergeable} (attempt ${attempt}/12)"

            if [[ "${mergeable}" == "MERGEABLE" ]]; then
              break
            fi

            if [[ "${mergeable}" == "CONFLICTING" ]]; then
              echo "Refusing to auto-merge DFS PR ${PR_NUMBER}: merge conflict detected." >&2
              exit 21
            fi

            sleep 5
          done

          if [[ "${mergeable}" != "MERGEABLE" ]]; then
            echo "Refusing to auto-merge DFS PR ${PR_NUMBER}: mergeable state did not settle." >&2
            exit 22
          fi

          gh pr merge "${PR_NUMBER}" --merge --delete-branch
