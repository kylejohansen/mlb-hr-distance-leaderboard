name: Update Long Ball data

on:
  workflow_dispatch:
  schedule:
    # Daily during the broad MLB season window.
    - cron: "17 10 * 3-11 *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh canonical pitch cache
        run: python scripts/generate_pitch_cache.py --season "$(date -u +%Y)"

      - name: Refresh Longball Index data
        run: python scripts/generate_hr_distance.py --season "$(date -u +%Y)" --min-hr 1 --input-csv data/raw/statcast-pitches.csv.gz

      - name: Update current season Longball Index alias
        run: cp public/data/hr-distance-latest.json "public/data/longball-index-$(date -u +%Y).json"

      - name: Refresh Hot Dog Stand data
        run: python scripts/generate_hot_dog_stand.py --season "$(date -u +%Y)"

      - name: Refresh defense-subsidy data
        run: python scripts/defense_subsidy.py --season "$(date -u +%Y)"

      - name: Refresh Tale archive pages and sitemap
        run: |
          set +e
          node scripts/build_static_pages.js
          static_status=$?
          node scripts/build_sitemap.js
          sitemap_status=$?
          if [[ "$static_status" -ne 0 || "$sitemap_status" -ne 0 ]]; then
            echo "::warning title=Tale archive refresh failed::build_static_pages exit=$static_status, build_sitemap exit=$sitemap_status. Core data commit will continue."
          fi
          exit 0

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::group::Git status after generation"
          git status --short
          echo "::endgroup::"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add public/data/hr-distance-latest.json public/data/longball-index-$(date -u +%Y).json public/data/daily-features-$(date -u +%Y).json public/data/tale-of-the-tape public/static/tale-of-the-tape public/sitemap.xml public/data/hot-dog-stand-latest.json public/data/hot-dog-index-$(date -u +%Y).json public/data/defense-subsidy-latest.json public/data/defense-subsidy data/raw/statcast-pitches.csv.gz
            echo "::group::Git status after narrow add"
            git status --short
            echo "::endgroup::"
            git commit -m "Update home run distance data"
            echo "::group::Git status after commit, before cleanup"
            git status --short
            echo "::endgroup::"
            # build_static_pages.js can regenerate tracked static pages outside
            # the daily update scope. This workflow intentionally commits only
            # the data/Tale/sitemap outputs above, then restores leftover
            # tracked static churn so it cannot block the rebase.
            if ! git diff --quiet; then
              echo "::group::Restoring unstaged tracked generated files before rebase"
              git diff --name-only
              git diff --name-only -z | xargs -0 -r git restore --worktree --
              echo "::endgroup::"
            fi
            git status --short
            git pull --rebase origin main
            git push
          else
            echo "No data changes to commit"
          fi
